name: 骨架质量检查
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@10.6.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:validate
      - run: pnpm check
      - run: pnpm build
